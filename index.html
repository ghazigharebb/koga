<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src https://exayuyporjusmbxcwxzz.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070A">
<script src="theme.js?v=f13c7053"></script>
<title>وەستا غەریب — کۆگا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="robots" content="noindex,nofollow">
<style>
/* VOLT — وەستا غەریب. بیرۆکە: دوکانی شەحن = وزە. فرۆشتن بازنەی وزە پڕ دەکات، کۆگا وەک باتری دەردەکەوێت. */
@font-face{font-family:"KU";src:local("Estedad Regular"),url(fonts/Estedad-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"KU";src:local("Estedad Medium"),url(fonts/Estedad-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"KU";src:local("Estedad SemiBold"),url(fonts/Estedad-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"KU";src:local("Estedad Bold"),url(fonts/Estedad-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"KU";src:local("Estedad ExtraBold"),url(fonts/Estedad-ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"KU";src:local("Estedad Black"),url(fonts/Estedad-Black.woff2) format("woff2");font-weight:900;font-display:swap}
:root{
  --bg:#06070A; --p1:#0D1016; --p2:#12161E; --p3:#19202B; --line:#1E2530; --line2:#2A3340;
  --ink:#F3F5F8; --ink2:#A9B1BF; --mute:#6A7383;
  --volt:#C9FF2F; --volt2:#8EE000; --volt-ink:#0B1000; --cyan:#3FE0FF; --red:#FF5468; --amber:#FFB224; --green:#35F2A0;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --glow:0 0 0 1px rgba(var(--vrgb),.35),0 0 28px -4px rgba(var(--vrgb),.45);
  /* accent as text/line (--vt) is separate from accent as fill (--volt): on a light page lime cannot be text */
  --vt:#C9FF2F; --vrgb:201,255,47; --crgb:63,224,255; --grgb:53,242,160; --rrgb:255,84,104; --argb:255,178,36; --wrgb:255,255,255; --srgb:0,0,0; --sa:1;
  --hair:rgba(255,255,255,.05); --inset:rgba(0,0,0,.35); --inset2:rgba(0,0,0,.25); --scrim:rgba(3,4,6,.66);
  --on-ink:#07080B; --on-g:#00160c; --on-c:#00161c; --on-a:#1a1000; --cs:dark;
  --side1:#12161E; --side2:#0B0D12; --pop:#171C26; --sheet1:var(--p3); --sheet2:var(--p1); --g1:#3FE0FF; --g2:#C9FF2F; --sbar:#06070A;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
/* light look («سپی»): soft green-grey page, white cards, deep-green accent text, the same lime only as a fill */
html[data-theme="light"]{
  --bg:#EDF0EA; --p1:#F7F9F5; --p2:#FFFFFF; --p3:#E6EBE1; --line:#DFE5D9; --line2:#C9D2C1;
  --ink:#161B13; --ink2:#48523F; --mute:#66725B;
  --volt:#C3F53C; --volt-ink:#142100; --vt:#3F7000; --cyan:#0A7A94; --red:#D2364A; --amber:#A45F00; --green:#087A4D;
  --vrgb:92,150,0; --crgb:10,122,148; --grgb:8,122,77; --rrgb:210,54,74; --argb:164,95,0; --wrgb:22,27,19; --srgb:45,60,30; --sa:.26;
  --hair:#E9EEE4; --inset:#F3F6F0; --inset2:#F3F6F0; --scrim:rgba(28,36,24,.42);
  --on-ink:#FFFFFF; --on-g:#FFFFFF; --on-c:#FFFFFF; --on-a:#FFFFFF; --cs:light;
  --side1:#FFFFFF; --side2:#F7F9F5; --pop:#FFFFFF; --sheet1:#FFFFFF; --sheet2:#F9FBF7; --g1:#12A3C2; --g2:#7CC410; --sbar:#161B13;
  --glow:0 0 0 1px rgba(92,150,0,.35),0 8px 22px -8px rgba(92,150,0,.45);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"KU",Vazirmatn,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::selection{background:var(--volt);color:var(--volt-ink)}
.num,.en{font-family:Sora,"KU",sans-serif;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.en{letter-spacing:-.1px}
/* living background */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(var(--wrgb),.035) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--wrgb),.035) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 30% 0%,#000 0%,transparent 70%)}
.orb{position:absolute;width:60vw;height:60vw;border-radius:50%;filter:blur(110px);opacity:.16;animation:drift 26s ease-in-out infinite alternate}
.orb.a{background:var(--volt);top:-34vw;left:-12vw}
.orb.b{background:var(--cyan);bottom:-40vw;right:-8vw;opacity:.1;animation-duration:34s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate3d(9vw,7vw,0) scale(1.15)}}

.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
/* ---------- sidebar ---------- */
.side{margin:14px;margin-inline-end:0;border-radius:24px;background:linear-gradient(180deg,rgba(18,22,30,.92),rgba(11,13,18,.92));border:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:14px;height:calc(100vh - 28px);backdrop-filter:blur(14px)}
.brand{display:flex;gap:12px;align-items:center;padding:2px 8px 24px}
.brand b{display:block;font-size:19px;font-weight:900;letter-spacing:-.2px}
.brand small,.who small{display:block;color:var(--mute);font-size:13px}
.bolt{width:44px;height:44px;border-radius:14px;background:var(--volt);color:var(--volt-ink);display:grid;place-items:center;box-shadow:var(--glow);position:relative;overflow:hidden}
.bolt svg{position:relative;animation:boltIn 1s var(--spring) both}
.bolt:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(120%);animation:sheen 4.5s 1.2s ease-in-out infinite}
@keyframes boltIn{from{transform:scale(0) rotate(-40deg)}}
@keyframes sheen{0%,70%{transform:translateX(120%)}100%{transform:translateX(-120%)}}
nav{display:flex;flex-direction:column;gap:2px;flex:1;position:relative}
#navInd{position:absolute;inset-inline:0;top:0;height:46px;border-radius:13px;background:linear-gradient(90deg,rgba(var(--vrgb),.02),rgba(var(--vrgb),.14));border:1px solid rgba(var(--vrgb),.22);transition:transform .45s var(--spring),opacity .2s;pointer-events:none}
#navInd:after{content:"";position:absolute;inset-inline-start:-1px;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--volt);box-shadow:0 0 14px var(--volt)}
nav a{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:13px;color:var(--ink2);text-decoration:none;font-weight:600;cursor:pointer;transition:color .2s,transform .2s var(--ease);position:relative;z-index:1}
nav a:hover{color:var(--ink);transform:translateX(-3px)}
nav a.on{color:var(--vt)}
nav a svg{flex:none;transition:transform .35s var(--spring)}
nav a:hover svg{transform:scale(1.15) rotate(-6deg)}
nav a em{margin-inline-start:auto;font-style:normal;background:var(--amber);color:var(--on-a);font-size:12px;font-weight:800;border-radius:99px;padding:0 8px;animation:pulseA 1.6s infinite}
@keyframes pulseA{50%{box-shadow:0 0 0 7px rgba(var(--argb),0)}0%{box-shadow:0 0 0 0 rgba(var(--argb),.55)}}
.side-foot{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.who{display:flex;gap:10px;align-items:center;padding:0 6px}
.av{width:38px;height:38px;border-radius:12px;background:var(--p3);display:grid;place-items:center;font-weight:800;color:var(--vt);font-family:Sora,"KU";flex:none}

/* ---------- top ---------- */
main{min-width:0;padding:22px 28px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.top h1{font-size:30px;font-weight:900;letter-spacing:-.6px;line-height:1.2}
.top .sub{color:var(--mute);font-size:14px;display:flex;gap:8px;align-items:center}
.live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(var(--grgb),.6);animation:live 1.8s infinite}
@keyframes live{70%{box-shadow:0 0 0 9px rgba(var(--grgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--grgb),0)}}
.top-r{display:flex;gap:10px;align-items:center}
.seg{display:flex;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:4px;position:relative}
.seg button{padding:8px 16px;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--ink2);transition:.25s var(--ease)}
.seg button.on{background:var(--volt);color:var(--volt-ink);box-shadow:0 4px 18px -4px rgba(var(--vrgb),.6)}
.bell{position:relative;width:46px;height:46px;border-radius:14px;background:var(--p1);border:1px solid var(--line);display:grid;place-items:center;transition:.2s}
.bell:hover{border-color:var(--vt);color:var(--vt)}
.bell.rung svg{animation:ring .7s var(--ease)}
@keyframes ring{20%{transform:rotate(18deg)}40%{transform:rotate(-15deg)}60%{transform:rotate(9deg)}80%{transform:rotate(-5deg)}}
.bell i{position:absolute;top:-5px;left:-5px;min-width:21px;height:21px;border-radius:99px;background:var(--red);color:#fff;font-style:normal;font-size:12px;font-weight:800;display:none;place-items:center;padding:0 5px;font-family:Sora;box-shadow:0 0 14px rgba(var(--rrgb),.7)}
.bell i.show{display:grid;animation:pop .45s var(--spring)}
@keyframes pop{from{transform:scale(0)}}

/* ---------- generic ---------- */
.card{background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:var(--r);position:relative}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(var(--wrgb),.06),transparent 30%);pointer-events:none;mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);mask-composite:exclude;padding:1px}
:where(html[data-theme="light"]) .card{box-shadow:0 1px 2px rgba(45,60,30,.05),0 10px 26px -16px rgba(45,60,30,.22)}
.pad{padding:20px}
.btn{background:var(--ink);color:var(--on-ink);border-radius:13px;padding:11px 20px;font-weight:800;transition:transform .15s var(--ease),box-shadow .2s,filter .2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn.amber,.btn.volt{background:var(--volt);color:var(--volt-ink);box-shadow:0 8px 30px -8px rgba(var(--vrgb),.6)}
.btn.green{background:var(--green);color:var(--on-g)}
.btn.red{background:var(--red);color:#fff}
.btn.big{padding:17px 18px;font-size:19px;width:100%;border-radius:16px}
.btn.volt:not(:disabled):after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.65) 50%,transparent 60%);transform:translateX(130%);animation:sheen 3.2s ease-in-out infinite}
.ghost{border:1px solid var(--line2);border-radius:12px;padding:9px 14px;font-weight:700;background:rgba(var(--wrgb),.02);transition:.2s var(--ease)}
.ghost:hover:not(:disabled){border-color:var(--vt);color:var(--vt);transform:translateY(-1px)}
.ghost:active{transform:scale(.96)} .ghost:disabled{opacity:.3;cursor:not-allowed}
.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.inp{width:100%;background:var(--inset);border:1.5px solid var(--line2);border-radius:13px;padding:12px 14px;outline:none;transition:.2s var(--ease);color:var(--ink)}
.inp::placeholder{color:var(--mute)}
.inp:focus{border-color:var(--vt);box-shadow:0 0 0 4px rgba(var(--vrgb),.14),0 0 30px -6px rgba(var(--vrgb),.35)}
select.inp option{background:var(--p2);color:var(--ink)}
label.f{display:grid;gap:6px;font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:800;white-space:nowrap;border:1px solid transparent}
.tag.g{background:rgba(var(--grgb),.1);color:var(--green);border-color:rgba(var(--grgb),.22)} .tag.r{background:rgba(var(--rrgb),.1);color:var(--red);border-color:rgba(var(--rrgb),.25)}
.tag.a{background:rgba(var(--argb),.1);color:var(--amber);border-color:rgba(var(--argb),.25)} .tag.b{background:rgba(var(--crgb),.1);color:var(--cyan);border-color:rgba(var(--crgb),.22)} .tag.n{background:rgba(var(--wrgb),.05);color:var(--ink2);border-color:var(--line2)}
.mute{color:var(--mute)} .row{display:flex;gap:10px;align-items:center} .sp{justify-content:space-between} .grow{flex:1;min-width:0}
h2{font-size:18px;font-weight:800} h3{font-size:15px;font-weight:800}
.empty{text-align:center;color:var(--mute);padding:34px 16px}
.empty b{display:block;color:var(--ink2);font-size:16px;margin-bottom:2px}
/* staggered reveal: only when a screen is entered */
.enter .rv{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985);filter:blur(8px)}}
.enter .prod{animation:tile .55s var(--ease) both;animation-delay:calc(min(var(--i,0),20)*28ms + 120ms)}
@keyframes tile{from{opacity:0;transform:translateY(18px) scale(.94)}}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:1fr 420px;gap:22px;align-items:start}
.search{position:relative;margin-bottom:14px}
.search input{padding:18px 54px 18px 110px;font-size:18px;border-radius:18px;background:var(--p1)}
.search>svg{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--vt)}
.search kbd{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:Sora;font-size:12px;color:var(--mute);border:1px solid var(--line2);border-radius:8px;padding:3px 8px;display:flex;gap:6px;align-items:center}
.scan{width:14px;height:10px;position:relative;overflow:hidden;border-inline:1.5px solid var(--mute)}
.scan:after{content:"";position:absolute;inset-inline:0;height:1.5px;background:var(--volt);box-shadow:0 0 6px var(--volt);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:0}to{top:calc(100% - 1.5px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 16px;border-radius:99px;background:var(--p1);border:1px solid var(--line);font-weight:700;font-size:14.5px;color:var(--ink2);transition:.25s var(--ease)}
.chip:hover{color:var(--ink);border-color:var(--line2);transform:translateY(-1px)}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.prod{--mx:50%;--my:50%;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:var(--r);padding:15px;text-align:start;display:flex;flex-direction:column;gap:9px;min-height:142px;transition:transform .3s var(--ease),border-color .25s,box-shadow .3s;position:relative;overflow:hidden;color:var(--ink)}
:where(html[data-theme="light"]) .prod{box-shadow:0 1px 2px rgba(45,60,30,.05),0 10px 26px -18px rgba(45,60,30,.2)}
.prod:before{content:"";position:absolute;inset:0;background:radial-gradient(220px circle at var(--mx) var(--my),rgba(var(--vrgb),.13),transparent 60%);opacity:0;transition:opacity .3s}
.prod:hover{transform:translateY(-4px);border-color:rgba(var(--vrgb),.45);box-shadow:0 18px 40px -18px rgba(var(--vrgb),.35)}
.prod:hover:before{opacity:1}
.prod:active{transform:scale(.97)}
.prod.out{opacity:.38;cursor:not-allowed;filter:saturate(.3)}
.prod.hit{animation:hit .5s var(--ease)}
@keyframes hit{30%{border-color:var(--vt);box-shadow:var(--glow);transform:scale(.96)}}
.prod>*{position:relative}
.prod .nm{font-weight:700;font-size:15px;line-height:1.4;text-align:left;flex:1;font-family:Sora,"KU"}
.prod .bc{font-size:12px;color:var(--mute);letter-spacing:.4px}
.prod .pr{font-size:22px;font-weight:800;font-family:Sora;letter-spacing:-.5px}
.bat{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--ink2)}
.bat i{display:flex;gap:2px;padding:2px;border:1.5px solid currentColor;border-radius:5px;position:relative;opacity:.9}
.bat i:after{content:"";position:absolute;right:-4.5px;top:3px;bottom:3px;width:2px;border-radius:0 2px 2px 0;background:currentColor}
.bat u{width:4px;height:9px;border-radius:1px;background:currentColor;opacity:.16;text-decoration:none}
.bat u.f{opacity:1}
.enter .bat u.f{animation:cell .4s var(--ease) both;animation-delay:calc(var(--k)*70ms + 450ms)}
@keyframes cell{from{opacity:.16;transform:scaleY(.2)}}
.bat.l5{color:var(--vt)}.bat.l4{color:var(--vt)}.bat.l3{color:var(--green)}.bat.l2{color:var(--amber)}.bat.l1,.bat.l0{color:var(--red)}
.bat.l1 i{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}

.cart{position:sticky;top:20px;display:flex;flex-direction:column;max-height:calc(100vh - 40px);overflow:hidden;border-radius:24px}
.cart-h{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.cart-count{transition:.2s}
.cart-count.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.35);background:var(--volt);color:var(--volt-ink)}}
.cart-lines{overflow:auto;padding:4px 20px;flex:1;min-height:130px}
.line{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:13px 0;border-bottom:1px dashed var(--line2)}
.line.new{animation:lineIn .45s var(--spring)}
@keyframes lineIn{from{opacity:0;transform:translateX(-30px)}}
.line .nm{font-weight:600;font-size:14.5px;text-align:left;font-family:Sora,"KU"}
.line>b{font-family:Sora}
.qty{display:flex;align-items:center;gap:7px}
.qty button{width:30px;height:30px;border-radius:10px;background:var(--p3);border:1px solid var(--line2);font-weight:800;font-size:17px;line-height:1;transition:.15s var(--ease)}
.qty button:hover{background:var(--volt);color:var(--volt-ink);border-color:var(--vt)}
.qty button:active{transform:scale(.85)}
.qty b{min-width:26px;text-align:center}
.cart-f{padding:16px 20px 20px;border-top:1px solid var(--line);display:grid;gap:11px;background:var(--inset2)}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font-size:40px;font-weight:800;letter-spacing:-1.5px;font-family:Sora;color:var(--vt);text-shadow:0 0 30px rgba(var(--vrgb),.35);line-height:1.1}
.tot b.flash{animation:flash .5s var(--ease)}
@keyframes flash{30%{transform:scale(1.07);text-shadow:0 0 44px rgba(var(--vrgb),.9)}}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay button{border:1.5px solid var(--line2);border-radius:13px;padding:11px;font-weight:800;transition:.2s var(--ease)}
.pay button.on{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.cartbar{display:none}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--mute);font-weight:700;text-align:start;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--hair);vertical-align:middle}
tr{transition:background .2s}
tbody tr:hover,table tr:hover td{background:rgba(var(--vrgb),.03)}
tr:last-child td{border-bottom:0}
td.en{text-align:left;font-weight:600}
.scroll{overflow:auto}
.enter table tr{animation:rowIn .5s var(--ease) both;animation-delay:calc(min(var(--i,0),16)*26ms + 150ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-bottom:18px}
.ringc{padding:22px;display:grid;place-items:center;text-align:center;overflow:hidden}
.ring{position:relative;width:250px;height:250px}
.ring svg{transform:rotate(-90deg);overflow:visible}
.ring .trk{stroke:var(--p3)}
.ring .arc{stroke:url(#rg);stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(var(--vrgb),.65));transition:stroke-dashoffset 1.6s var(--ease)}
.ring .ticks{stroke:var(--line2)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.ring .mid small{color:var(--mute);font-weight:700;font-size:14px}
.ring .mid b{font-family:Sora;font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1.1}
.ring .mid span{color:var(--vt);font-weight:800;font-family:Sora;font-size:15px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.kpi{padding:18px 20px;overflow:hidden}
.kpi small{color:var(--mute);font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:6px;font-family:Sora}
.kpi .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--p3)}
.bars{display:flex;align-items:flex-end;gap:6px;height:118px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--g2),rgba(var(--vrgb),.15));min-height:3px;transform-origin:bottom;position:relative}
.bars i.z{background:var(--p3)}
.bars i.now{box-shadow:0 0 22px rgba(var(--vrgb),.6)}
.bars i.now:after{content:"";position:absolute;inset:0;border-radius:inherit;background:#fff;opacity:0;animation:nowp 1.6s infinite}
@keyframes nowp{50%{opacity:.35}}
.enter .bars i{animation:grow .9s var(--ease) both;animation-delay:calc(var(--i)*45ms + 350ms)}
@keyframes grow{from{transform:scaleY(0)}}
.bars s{font-size:11px;color:var(--mute);text-decoration:none;font-family:Sora}
.duel{display:grid;gap:12px;margin-top:6px}
.duel .bar{height:10px;border-radius:99px;background:var(--p3);overflow:hidden}
.duel .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g1),var(--g2));transform-origin:right}
.enter .duel .bar i{animation:growx 1.1s var(--ease) both .5s}
@keyframes growx{from{transform:scaleX(0)}}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair);align-items:flex-start}
.item:last-child{border:0}
.item.fresh{animation:lineIn .5s var(--spring)}
.dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;border:1px solid transparent}
.dot.g{background:rgba(var(--grgb),.1);color:var(--green);border-color:rgba(var(--grgb),.2)} .dot.r{background:rgba(var(--rrgb),.1);color:var(--red);border-color:rgba(var(--rrgb),.2)}
.dot.a{background:rgba(var(--argb),.1);color:var(--amber);border-color:rgba(var(--argb),.22)} .dot.b{background:rgba(var(--crgb),.1);color:var(--cyan);border-color:rgba(var(--crgb),.2)} .dot.n{background:rgba(var(--wrgb),.05);color:var(--ink2);border-color:var(--line2)}
.item p{font-size:15px}.item small{color:var(--mute);font-size:13px}
.wait{border-color:rgba(var(--argb),.45);box-shadow:0 0 0 1px rgba(var(--argb),.15),0 0 50px -14px rgba(var(--argb),.5)}
.wait:after{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1px solid var(--amber);opacity:0;animation:halo 2s infinite;pointer-events:none}
@keyframes halo{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.03)}}

/* ---------- drawer / modal / toasts ---------- */
.drawer{position:fixed;inset:14px auto 14px 14px;width:400px;max-width:calc(100vw - 28px);background:rgba(13,16,22,.94);backdrop-filter:blur(22px);border:1px solid var(--line2);border-radius:24px;box-shadow:30px 0 90px rgba(var(--srgb),calc(.6*var(--sa)));transform:translateX(-112%);transition:transform .55s var(--spring);z-index:30;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line)}
#feed{overflow:auto;padding:4px 20px;flex:1}
.drawer.on .item{animation:lineIn .5s var(--spring) both;animation-delay:calc(min(var(--i,0),12)*40ms + 120ms)}
.modal{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(10px);display:none;place-items:center;z-index:40;padding:16px}
.modal.on{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{background:linear-gradient(180deg,var(--sheet1),var(--sheet2));border:1px solid var(--line2);border-radius:24px;padding:24px;width:470px;max-width:100%;max-height:90vh;overflow:auto;animation:sheet .5s var(--spring);box-shadow:0 40px 120px rgba(var(--srgb),calc(.7*var(--sa)))}
@keyframes sheet{from{transform:translateY(40px) scale(.92);opacity:0}}
.sheet h2{font-size:21px;margin-bottom:14px}
.acts{display:flex;gap:8px;justify-content:flex-start;margin-top:18px}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,90px);background:var(--ink);color:var(--on-ink);padding:12px 22px;border-radius:14px;font-weight:800;transition:transform .5s var(--spring);z-index:60;max-width:90vw;box-shadow:0 20px 50px rgba(var(--srgb),calc(.5*var(--sa)))}
.toast.on{transform:translate(-50%,0)} .toast.err{background:var(--red);color:#fff;animation:shake .4s}
@keyframes shake{25%{margin-left:-8px}50%{margin-left:8px}75%{margin-left:-4px}}
/* phone-style push preview */
#push{position:fixed;top:18px;left:18px;z-index:55;display:grid;gap:10px;width:360px;max-width:calc(100vw - 36px);pointer-events:none}
.push{background:rgba(22,27,36,.9);backdrop-filter:blur(20px);border:1px solid var(--line2);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 24px 60px rgba(var(--srgb),calc(.55*var(--sa)));animation:pushIn .6s var(--spring) both}
.push.out{animation:pushOut .4s var(--ease) both}
@keyframes pushIn{from{transform:translateY(-40px) scale(.9);opacity:0}}
@keyframes pushOut{to{transform:translateX(-40px);opacity:0}}
.push small{color:var(--vt);font-weight:800;font-size:12px;display:block}
.push p{font-size:14.5px;line-height:1.5}
.rc{font-size:14.5px}.rc .row{padding:5px 0}.rc hr{border:0;border-top:1px dashed var(--line2);margin:9px 0}

/* ---------- sale success: the charge ---------- */
#charge{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(var(--vrgb),.16),rgba(3,4,6,.92) 55%);backdrop-filter:blur(8px)}
#charge.on{display:grid;animation:fade .2s}
#charge.bye{animation:bye .35s var(--ease) both}
@keyframes bye{to{opacity:0;transform:scale(1.06)}}
.chg{position:relative;width:300px;height:300px;display:grid;place-items:center}
.chg svg{position:absolute;inset:0;overflow:visible}
.chg .c1{fill:none;stroke:var(--p3);stroke-width:6}
.chg .c2{fill:none;stroke:var(--vt);stroke-width:6;stroke-linecap:round;stroke-dasharray:848;stroke-dashoffset:848;transform:rotate(-90deg);transform-origin:center;filter:drop-shadow(0 0 14px var(--volt));animation:fill .75s var(--ease) forwards .05s}
@keyframes fill{to{stroke-dashoffset:0}}
.chg .bz{fill:var(--volt);stroke:var(--vt);stroke-width:2;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;fill-opacity:0;filter:drop-shadow(0 0 18px var(--volt));animation:draw .5s ease-out forwards .3s,fillin .3s forwards .7s}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fillin{to{fill-opacity:1}}
.chg .sp{stroke:var(--vt);stroke-width:3;stroke-linecap:round;stroke-dasharray:26 200;stroke-dashoffset:26;opacity:0;animation:spark .6s ease-out forwards .72s}
@keyframes spark{0%{opacity:1;stroke-dashoffset:26}100%{opacity:0;stroke-dashoffset:-60}}
.chg .wave{position:absolute;inset:0;border-radius:50%;border:2px solid var(--volt);opacity:0;animation:wave .9s ease-out forwards .72s}
@keyframes wave{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.chgt{position:absolute;top:calc(50% + 176px);left:0;right:0;text-align:center;animation:rise .6s var(--ease) both .75s}
.chgt b{display:block;font-family:Sora;font-size:46px;font-weight:800;letter-spacing:-1.5px;color:var(--vt);text-shadow:0 0 40px rgba(var(--vrgb),.6)}
.chgt span{font-weight:800;font-size:19px}

/* role switch: circular reveal */
::view-transition-old(root){animation:none}
::view-transition-new(root){animation:reveal .7s var(--ease) both}
@keyframes reveal{from{clip-path:circle(0 at var(--vx,85%) var(--vy,90%))}to{clip-path:circle(150% at var(--vx,85%) var(--vy,90%))}}

/* daily sales line */

.lnwrap{position:relative;margin-top:10px}

.lnsvg .gl{stroke:var(--hair);stroke-width:1;vector-effect:non-scaling-stroke}

.lnsvg .ln{stroke-dasharray:1;stroke-dashoffset:0;filter:drop-shadow(0 6px 14px rgba(var(--vrgb),.35))}
.enter .lnsvg .ln{animation:drawln 1.7s var(--ease) both .25s}
.enter .lnsvg .ar{animation:fade 1.2s ease both .9s}

.lnx{position:absolute;inset:0;pointer-events:none}

b.num,span.num{white-space:nowrap}

/* the message box is fully gone when there is no message (on every screen size) */

.toast.on{opacity:1;visibility:visible;pointer-events:auto;transition:transform .5s var(--spring),opacity .2s ease,visibility 0s}
