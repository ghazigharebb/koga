<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070A">
<title>وەستا غەریب — کۆگا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="robots" content="noindex,nofollow">
<style>
/* VOLT — وەستا غەریب. بیرۆکە: دوکانی شەحن = وزە. فرۆشتن بازنەی وزە پڕ دەکات، کۆگا وەک باتری دەردەکەوێت. */
@font-face{font-family:"KU";src:local("Estedad Regular"),url(fonts/Estedad-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"KU";src:local("Estedad Medium"),url(fonts/Estedad-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"KU";src:local("Estedad SemiBold"),url(fonts/Estedad-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"KU";src:local("Estedad Bold"),url(fonts/Estedad-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"KU";src:local("Estedad ExtraBold"),url(fonts/Estedad-ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"KU";src:local("Estedad Black"),url(fonts/Estedad-Black.woff2) format("woff2");font-weight:900;font-display:swap}
:root{
  --bg:#06070A; --p1:#0D1016; --p2:#12161E; --p3:#19202B; --line:#1E2530; --line2:#2A3340;
  --ink:#F3F5F8; --ink2:#A9B1BF; --mute:#6A7383;
  --volt:#C9FF2F; --volt2:#8EE000; --volt-ink:#0B1000; --cyan:#3FE0FF; --red:#FF5468; --amber:#FFB224; --green:#35F2A0;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --glow:0 0 0 1px rgba(201,255,47,.35),0 0 28px -4px rgba(201,255,47,.45);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"KU",Vazirmatn,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::selection{background:var(--volt);color:var(--volt-ink)}
.num,.en{font-family:Sora,"KU",sans-serif;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.en{letter-spacing:-.1px}
/* living background */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 30% 0%,#000 0%,transparent 70%)}
.orb{position:absolute;width:60vw;height:60vw;border-radius:50%;filter:blur(110px);opacity:.16;animation:drift 26s ease-in-out infinite alternate}
.orb.a{background:var(--volt);top:-34vw;left:-12vw}
.orb.b{background:var(--cyan);bottom:-40vw;right:-8vw;opacity:.1;animation-duration:34s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate3d(9vw,7vw,0) scale(1.15)}}

.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
/* ---------- sidebar ---------- */
.side{margin:14px;margin-inline-end:0;border-radius:24px;background:linear-gradient(180deg,rgba(18,22,30,.92),rgba(11,13,18,.92));border:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:14px;height:calc(100vh - 28px);backdrop-filter:blur(14px)}
.brand{display:flex;gap:12px;align-items:center;padding:2px 8px 24px}
.brand b{display:block;font-size:18px;font-weight:900;letter-spacing:-.2px}
.brand small,.who small{display:block;color:var(--mute);font-size:12px}
.bolt{width:44px;height:44px;border-radius:14px;background:var(--volt);color:var(--volt-ink);display:grid;place-items:center;box-shadow:var(--glow);position:relative;overflow:hidden}
.bolt svg{position:relative;animation:boltIn 1s var(--spring) both}
.bolt:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(120%);animation:sheen 4.5s 1.2s ease-in-out infinite}
@keyframes boltIn{from{transform:scale(0) rotate(-40deg)}}
@keyframes sheen{0%,70%{transform:translateX(120%)}100%{transform:translateX(-120%)}}
nav{display:flex;flex-direction:column;gap:2px;flex:1;position:relative}
#navInd{position:absolute;inset-inline:0;top:0;height:46px;border-radius:13px;background:linear-gradient(90deg,rgba(201,255,47,.02),rgba(201,255,47,.14));border:1px solid rgba(201,255,47,.22);transition:transform .45s var(--spring),opacity .2s;pointer-events:none}
#navInd:after{content:"";position:absolute;inset-inline-start:-1px;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--volt);box-shadow:0 0 14px var(--volt)}
nav a{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:13px;color:var(--ink2);text-decoration:none;font-weight:600;cursor:pointer;transition:color .2s,transform .2s var(--ease);position:relative;z-index:1}
nav a:hover{color:#fff;transform:translateX(-3px)}
nav a.on{color:var(--volt)}
nav a svg{flex:none;transition:transform .35s var(--spring)}
nav a:hover svg{transform:scale(1.15) rotate(-6deg)}
nav a em{margin-inline-start:auto;font-style:normal;background:var(--amber);color:#1a1000;font-size:11px;font-weight:800;border-radius:99px;padding:0 8px;animation:pulseA 1.6s infinite}
@keyframes pulseA{50%{box-shadow:0 0 0 7px rgba(255,178,36,0)}0%{box-shadow:0 0 0 0 rgba(255,178,36,.55)}}
.side-foot{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.who{display:flex;gap:10px;align-items:center;padding:0 6px}
.av{width:38px;height:38px;border-radius:12px;background:var(--p3);display:grid;place-items:center;font-weight:800;color:var(--volt);font-family:Sora,"KU";flex:none}

/* ---------- top ---------- */
main{min-width:0;padding:22px 28px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.top h1{font-size:30px;font-weight:900;letter-spacing:-.6px;line-height:1.2}
.top .sub{color:var(--mute);font-size:13px;display:flex;gap:8px;align-items:center}
.live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(53,242,160,.6);animation:live 1.8s infinite}
@keyframes live{70%{box-shadow:0 0 0 9px rgba(53,242,160,0)}100%{box-shadow:0 0 0 0 rgba(53,242,160,0)}}
.top-r{display:flex;gap:10px;align-items:center}
.seg{display:flex;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:4px;position:relative}
.seg button{padding:8px 16px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--ink2);transition:.25s var(--ease)}
.seg button.on{background:var(--volt);color:var(--volt-ink);box-shadow:0 4px 18px -4px rgba(201,255,47,.6)}
.bell{position:relative;width:46px;height:46px;border-radius:14px;background:var(--p1);border:1px solid var(--line);display:grid;place-items:center;transition:.2s}
.bell:hover{border-color:var(--volt);color:var(--volt)}
.bell.rung svg{animation:ring .7s var(--ease)}
@keyframes ring{20%{transform:rotate(18deg)}40%{transform:rotate(-15deg)}60%{transform:rotate(9deg)}80%{transform:rotate(-5deg)}}
.bell i{position:absolute;top:-5px;left:-5px;min-width:21px;height:21px;border-radius:99px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:none;place-items:center;padding:0 5px;font-family:Sora;box-shadow:0 0 14px rgba(255,84,104,.7)}
.bell i.show{display:grid;animation:pop .45s var(--spring)}
@keyframes pop{from{transform:scale(0)}}

/* ---------- generic ---------- */
.card{background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:var(--r);position:relative}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 30%);pointer-events:none;mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);mask-composite:exclude;padding:1px}
.pad{padding:20px}
.btn{background:var(--ink);color:#07080B;border-radius:13px;padding:11px 20px;font-weight:800;transition:transform .15s var(--ease),box-shadow .2s,filter .2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn.amber,.btn.volt{background:var(--volt);color:var(--volt-ink);box-shadow:0 8px 30px -8px rgba(201,255,47,.6)}
.btn.green{background:var(--green);color:#00160c}
.btn.red{background:var(--red);color:#fff}
.btn.big{padding:17px 18px;font-size:18px;width:100%;border-radius:16px}
.btn.volt:not(:disabled):after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.65) 50%,transparent 60%);transform:translateX(130%);animation:sheen 3.2s ease-in-out infinite}
.ghost{border:1px solid var(--line2);border-radius:12px;padding:9px 14px;font-weight:700;background:rgba(255,255,255,.02);transition:.2s var(--ease)}
.ghost:hover:not(:disabled){border-color:var(--volt);color:var(--volt);transform:translateY(-1px)}
.ghost:active{transform:scale(.96)} .ghost:disabled{opacity:.3;cursor:not-allowed}
.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.inp{width:100%;background:rgba(0,0,0,.35);border:1.5px solid var(--line2);border-radius:13px;padding:12px 14px;outline:none;transition:.2s var(--ease);color:var(--ink)}
.inp::placeholder{color:var(--mute)}
.inp:focus{border-color:var(--volt);box-shadow:0 0 0 4px rgba(201,255,47,.14),0 0 30px -6px rgba(201,255,47,.35)}
select.inp option{background:#12161E}
label.f{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap;border:1px solid transparent}
.tag.g{background:rgba(53,242,160,.1);color:var(--green);border-color:rgba(53,242,160,.22)} .tag.r{background:rgba(255,84,104,.1);color:var(--red);border-color:rgba(255,84,104,.25)}
.tag.a{background:rgba(255,178,36,.1);color:var(--amber);border-color:rgba(255,178,36,.25)} .tag.b{background:rgba(63,224,255,.1);color:var(--cyan);border-color:rgba(63,224,255,.22)} .tag.n{background:rgba(255,255,255,.05);color:var(--ink2);border-color:var(--line2)}
.mute{color:var(--mute)} .row{display:flex;gap:10px;align-items:center} .sp{justify-content:space-between} .grow{flex:1;min-width:0}
h2{font-size:17px;font-weight:800} h3{font-size:14px;font-weight:800}
.empty{text-align:center;color:var(--mute);padding:34px 16px}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:2px}
/* staggered reveal: only when a screen is entered */
.enter .rv{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985);filter:blur(8px)}}
.enter .prod{animation:tile .55s var(--ease) both;animation-delay:calc(min(var(--i,0),20)*28ms + 120ms)}
@keyframes tile{from{opacity:0;transform:translateY(18px) scale(.94)}}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:1fr 420px;gap:22px;align-items:start}
.search{position:relative;margin-bottom:14px}
.search input{padding:18px 54px 18px 110px;font-size:17px;border-radius:18px;background:var(--p1)}
.search>svg{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--volt)}
.search kbd{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:Sora;font-size:11px;color:var(--mute);border:1px solid var(--line2);border-radius:8px;padding:3px 8px;display:flex;gap:6px;align-items:center}
.scan{width:14px;height:10px;position:relative;overflow:hidden;border-inline:1.5px solid var(--mute)}
.scan:after{content:"";position:absolute;inset-inline:0;height:1.5px;background:var(--volt);box-shadow:0 0 6px var(--volt);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:0}to{top:calc(100% - 1.5px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 16px;border-radius:99px;background:var(--p1);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--ink2);transition:.25s var(--ease)}
.chip:hover{color:#fff;border-color:var(--line2);transform:translateY(-1px)}
.chip.on{background:var(--ink);color:#07080B;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.prod{--mx:50%;--my:50%;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:var(--r);padding:15px;text-align:start;display:flex;flex-direction:column;gap:9px;min-height:142px;transition:transform .3s var(--ease),border-color .25s,box-shadow .3s;position:relative;overflow:hidden;color:var(--ink)}
.prod:before{content:"";position:absolute;inset:0;background:radial-gradient(220px circle at var(--mx) var(--my),rgba(201,255,47,.13),transparent 60%);opacity:0;transition:opacity .3s}
.prod:hover{transform:translateY(-4px);border-color:rgba(201,255,47,.45);box-shadow:0 18px 40px -18px rgba(201,255,47,.35)}
.prod:hover:before{opacity:1}
.prod:active{transform:scale(.97)}
.prod.out{opacity:.38;cursor:not-allowed;filter:saturate(.3)}
.prod.hit{animation:hit .5s var(--ease)}
@keyframes hit{30%{border-color:var(--volt);box-shadow:var(--glow);transform:scale(.96)}}
.prod>*{position:relative}
.prod .nm{font-weight:700;font-size:14px;line-height:1.4;text-align:left;flex:1;font-family:Sora,"KU"}
.prod .bc{font-size:11px;color:var(--mute);letter-spacing:.4px}
.prod .pr{font-size:21px;font-weight:800;font-family:Sora;letter-spacing:-.5px}
.bat{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--ink2)}
.bat i{display:flex;gap:2px;padding:2px;border:1.5px solid currentColor;border-radius:5px;position:relative;opacity:.9}
.bat i:after{content:"";position:absolute;right:-4.5px;top:3px;bottom:3px;width:2px;border-radius:0 2px 2px 0;background:currentColor}
.bat u{width:4px;height:9px;border-radius:1px;background:currentColor;opacity:.16;text-decoration:none}
.bat u.f{opacity:1}
.enter .bat u.f{animation:cell .4s var(--ease) both;animation-delay:calc(var(--k)*70ms + 450ms)}
@keyframes cell{from{opacity:.16;transform:scaleY(.2)}}
.bat.l5{color:var(--volt)}.bat.l4{color:var(--volt)}.bat.l3{color:var(--green)}.bat.l2{color:var(--amber)}.bat.l1,.bat.l0{color:var(--red)}
.bat.l1 i{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}

.cart{position:sticky;top:20px;display:flex;flex-direction:column;max-height:calc(100vh - 40px);overflow:hidden;border-radius:24px}
.cart-h{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.cart-count{transition:.2s}
.cart-count.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.35);background:var(--volt);color:var(--volt-ink)}}
.cart-lines{overflow:auto;padding:4px 20px;flex:1;min-height:130px}
.line{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:13px 0;border-bottom:1px dashed var(--line2)}
.line.new{animation:lineIn .45s var(--spring)}
@keyframes lineIn{from{opacity:0;transform:translateX(-30px)}}
.line .nm{font-weight:600;font-size:13.5px;text-align:left;font-family:Sora,"KU"}
.line>b{font-family:Sora}
.qty{display:flex;align-items:center;gap:7px}
.qty button{width:30px;height:30px;border-radius:10px;background:var(--p3);border:1px solid var(--line2);font-weight:800;font-size:16px;line-height:1;transition:.15s var(--ease)}
.qty button:hover{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
.qty button:active{transform:scale(.85)}
.qty b{min-width:26px;text-align:center}
.cart-f{padding:16px 20px 20px;border-top:1px solid var(--line);display:grid;gap:11px;background:rgba(0,0,0,.25)}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font-size:40px;font-weight:800;letter-spacing:-1.5px;font-family:Sora;color:var(--volt);text-shadow:0 0 30px rgba(201,255,47,.35);line-height:1.1}
.tot b.flash{animation:flash .5s var(--ease)}
@keyframes flash{30%{transform:scale(1.07);text-shadow:0 0 44px rgba(201,255,47,.9)}}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay button{border:1.5px solid var(--line2);border-radius:13px;padding:11px;font-weight:800;transition:.2s var(--ease)}
.pay button.on{border-color:var(--ink);background:var(--ink);color:#07080B}
.cartbar{display:none}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mute);font-weight:700;text-align:start;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
tr{transition:background .2s}
tbody tr:hover,table tr:hover td{background:rgba(201,255,47,.03)}
tr:last-child td{border-bottom:0}
td.en{text-align:left;font-weight:600}
.scroll{overflow:auto}
.enter table tr{animation:rowIn .5s var(--ease) both;animation-delay:calc(min(var(--i,0),16)*26ms + 150ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-bottom:18px}
.ringc{padding:22px;display:grid;place-items:center;text-align:center;overflow:hidden}
.ring{position:relative;width:250px;height:250px}
.ring svg{transform:rotate(-90deg);overflow:visible}
.ring .trk{stroke:var(--p3)}
.ring .arc{stroke:url(#rg);stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(201,255,47,.65));transition:stroke-dashoffset 1.6s var(--ease)}
.ring .ticks{stroke:var(--line2)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.ring .mid small{color:var(--mute);font-weight:700;font-size:13px}
.ring .mid b{font-family:Sora;font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1.1}
.ring .mid span{color:var(--volt);font-weight:800;font-family:Sora;font-size:14px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.kpi{padding:18px 20px;overflow:hidden}
.kpi small{color:var(--mute);font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}
.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:6px;font-family:Sora}
.kpi .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--p3)}
.bars{display:flex;align-items:flex-end;gap:6px;height:118px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--volt),rgba(201,255,47,.15));min-height:3px;transform-origin:bottom;position:relative}
.bars i.z{background:var(--p3)}
.bars i.now{box-shadow:0 0 22px rgba(201,255,47,.6)}
.bars i.now:after{content:"";position:absolute;inset:0;border-radius:inherit;background:#fff;opacity:0;animation:nowp 1.6s infinite}
@keyframes nowp{50%{opacity:.35}}
.enter .bars i{animation:grow .9s var(--ease) both;animation-delay:calc(var(--i)*45ms + 350ms)}
@keyframes grow{from{transform:scaleY(0)}}
.bars s{font-size:10px;color:var(--mute);text-decoration:none;font-family:Sora}
.duel{display:grid;gap:12px;margin-top:6px}
.duel .bar{height:10px;border-radius:99px;background:var(--p3);overflow:hidden}
.duel .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--volt));transform-origin:right}
.enter .duel .bar i{animation:growx 1.1s var(--ease) both .5s}
@keyframes growx{from{transform:scaleX(0)}}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.05);align-items:flex-start}
.item:last-child{border:0}
.item.fresh{animation:lineIn .5s var(--spring)}

<script>

  function init(seedItems, seedCustomers, now) {

  }

  /* ---------- log + notifications ---------- */
  function log(st, by, branch, now, kind, text, to, toUser) {

  /* what a return is worth; null when a quantity is more than what is left on the receipt */

    const m = {}, g = id => m[id] || (m[id] = { sold: 0, ret: 0, exch: 0 }), t0 = dayStart(st, now);
    st.sales.filter(x => x.branch === b && !x.legacy && ms(x.t) >= t0).forEach(x => x.lines.forEach(l => { g(l.id).sold += l.qty; g(l.id).ret += l.ret; }));

  const A = {
    sell: [1, (st, u, p, now) => {

    discountRequest: [1, (st, u, p, now) => {

      st.items.unshift(it);

    <label class="f">چەند دانە (زۆرترین <span class="num">${can}</span>)<input class="inp num" id="wQ" type="text" inputmode="decimal" min="1" max="${can}" step="1" value="1"></label><label class="f">کێشەی کاڵاکە<input class="inp" id="wW" placeholder="بۆ نموونە: شەحن ناکات"></label>

}

/* ---------- items & stock ---------- */
V.items = () => {
  const noBc = S.items.filter(i => !i.bc).length, low = S.items.filter(i => i.s[S.branch] <= 5).length, own = isOwner();
  const f = S.itemFilter, list = S.items.filter(i => f === 'nobc' ? !i.bc : f === 'low' ? i.s[S.branch] <= 5 : true);
  // what the whole stock (all branches) is worth
  const q = i => i.s.reduce((a, n) => a + n, 0), units = S.items.reduce((a, i) => a + q(i), 0);
  const vR = S.items.reduce((a, i) => a + q(i) * i.r, 0), vW = S.items.reduce((a, i) => a + q(i) * i.w, 0);
  const withC = S.items.filter(i => i.c != null), vC = withC.reduce((a, i) => a + q(i) * i.c, 0), vRk = withC.reduce((a, i) => a + q(i) * i.r, 0), noC = S.items.filter(i => i.c == null && q(i) > 0).length;
  const P = S.purchases, pQty = P.reduce((a, x) => a + x.qty, 0), pRet = P.reduce((a, x) => a + x.qty * x.retail, 0), pCost = P.reduce((a, x) => a + (x.cost != null ? x.qty * x.cost : 0), 0);
  const itemsTable = `<div class="card scroll"><table><tr><th>کاڵا</th><th>بارکۆد</th><th>پۆل</th>${own ? '<th>کڕین</th>' : ''}<th>تاک</th><th>جوملە</th><th>${S.branches[0]}</th><th>${S.branches[1]}</th><th></th></tr>
    ${list.map(i => `<tr><td class="en">${esc(i.name)}${i.f ? ` <span class="tag r">خراپ <span class="num">${i.f}</span></span>` : ''}</td><td class="num">${i.bc || '<span class="tag r">بێ بارکۆد</span>'}</td><td><span class="tag n">${i.cat}</span></td>${own ? `<td>${i.c != null ? money(i.c) : '<span class="mute">—</span>'}</td>` : ''}<td>${money(i.r)}</td><td>${i.w > 0 ? money(i.w) + (i.w > i.r ? ' <span class="tag r" title="نرخی جوملە لە تاک زیاترە">گرانترە</span>' : '') : '<span class="tag r">دانەنراوە</span>'}</td>
      ${i.s.map(n => `<td>${bat(n)}</td>`).join('')}
      <td><div class="row">${own ? `<button class="ghost sm" data-e="${i.id}">نرخ</button>` : ''}<button class="ghost sm" data-adj="${i.id}">کەمکردن</button>${!i.bc ? `<button class="ghost sm" data-b="${i.id}">بارکۆد</button>` : ''}</div></td></tr>`).join('')}</table></div>`;
  const inTable = `<div class="kgrid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))"><div class="card kpi"><small>دانەی داخیلکراو</small>${cuInt(pQty)}</div><div class="card kpi"><small>بەهای فرۆشتنیان</small>${cu(pRet)}</div>${own ? `<div class="card kpi"><small>کۆی کڕین</small>${cu(pCost, 'pCostAll')}</div><div class="card kpi"><small>قازانجی چاوەڕوانکراو</small>${cu(P.reduce((a, x) => a + (x.cost != null ? x.qty * (x.retail - x.cost) : 0), 0))}</div>` : ''}</div>
    <div class="card scroll">${P.length ? `<table><tr><th>کات</th><th>کاڵا</th><th>بڕ</th><th>نرخی فرۆشتن</th><th>بەهای فرۆشتن</th>${own ? '<th>نرخی کڕین</th><th>کۆی کڕین</th><th>قازانج</th>' : ''}<th>کێ</th><th>لق</th></tr>${P.map(x => `<tr><td>${hm(x.t)}</td><td class="en">${esc(x.name)}</td><td class="num"><b>${x.qty}</b></td><td>${money(x.retail)}</td><td>${money(x.qty * x.retail)}</td>${own ? (x.cost != null ? `<td>${money(x.cost)}</td><td><b>${money(x.qty * x.cost)}</b></td><td><span class="tag g">${money(x.qty * (x.retail - x.cost))}</span></td>` : '<td colspan="3"><span class="tag a">نرخی کڕین دانەنراوە</span></td>') : ''}<td class="en">${esc(x.by)}</td><td>${S.branches[x.branch]}</td></tr>`).join('')}</table>` : '<div class="empty"><b>هێشتا هیچ کاڵایەک داخیل نەکراوە</b>هەر داخیلکردنێک بە بڕ، نرخ و کۆی گشتییەوە لێرە تۆمار دەبێت</div>'}</div>`;
  $('#view').innerHTML = `<div class="kgrid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      <div class="card kpi"><small><span class="ic">${ico('items', 15)}</span>دانەی ناو هەموو لقەکان</small>${cuInt(units)}</div>
      <div class="card kpi"><small><span class="ic">${ico('pos', 15)}</span>بەهای کۆگا بە نرخی تاک</small>${cu(vR, 'valRetail')}</div>
      <div class="card kpi"><small><span class="ic">${ico('customers', 15)}</span>بە نرخی جوملە</small>${cu(vW)}</div>
      ${own ? `<div class="card kpi"><small><span class="ic">${ico('expenses', 15)}</span>بە پارەی خۆی (نرخی کڕین)</small>${withC.length ? cu(vC, 'valCost') : '<b id="valCost" class="mute" style="font-size:17px">نرخی کڕین دانەنراوە</b>'}${noC ? `<small style="margin-top:6px"><span class="tag a"><span class="num">${noC}</span> کاڵا نرخی کڕینیان نییە</span></small>` : ''}</div>
      <div class="card kpi"><small><span class="ic">${ico('check', 15)}</span>قازانج ئەگەر هەمووی بفرۆشرێت</small>${withC.length ? cu(vRk - vC, 'valProfit') : '<b class="mute" style="font-size:17px">—</b>'}</div>` : ''}</div>
    <div class="row sp" style="margin-bottom:14px;flex-wrap:wrap">
    <div class="chips" style="margin:0"><button class="chip ${f === 'all' ? 'on' : ''}" data-f="all">هەموو <span class="num">${S.items.length}</span></button><button class="chip ${f === 'nobc' ? 'on' : ''}" data-f="nobc">بێ بارکۆد <span class="num">${noBc}</span></button><button class="chip ${f === 'low' ? 'on' : ''}" data-f="low">کەمبوو <span class="num">${low}</span></button><button class="chip ${f === 'in' ? 'on' : ''}" data-f="in">مێژووی داخیلکردن <span class="num">${P.length}</span></button></div>
    <div class="row">${own ? '<button class="ghost" id="newItem">کاڵای نوێ</button>' : ''}<button class="btn volt" id="recv">داخیلکردنی کاڵا</button></div></div>
    ${noBc && f !== 'in' ? `<div class="card pad row wait" style="margin-bottom:14px"><div class="dot a">${ico('alert')}</div><div class="grow"><b><span class="num">${noBc}</span> کاڵا بارکۆدیان نییە</b><div class="mute" style="font-size:13px">لە سیستەمە کۆنەکە بە «0» یان بەتاڵ تۆمار کراون. تا بارکۆدیان بۆ دانەنرێت، کەس ناتوانێت داخیلیان بکات.</div></div></div>` : ''}
    ${f === 'in' ? inTable : itemsTable}`;
  $('#view').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.itemFilter = b.dataset.f; V.items(); });
  $('#recv').onclick = receive;
  $('#view').querySelectorAll('[data-adj]').forEach(b => b.onclick = () => adjust(item(+b.dataset.adj)));
  $('#view').querySelectorAll('[data-b]').forEach(b => b.onclick = () => setBarcode(item(+b.dataset.b)));

    $('#newItem').onclick = newItem;
    $('#view').querySelectorAll('[data-e]').forEach(b => b.onclick = () => editPrice(item(+b.dataset.e)));
  }
};
function adjust(it) {
  modal(`<h2>کەمکردنەوەی کۆگا — ${S.branches[S.branch]}</h2><p class="en" style="text-align:left;font-weight:700;margin-bottom:4px">${esc(it.name)}</p><p class="mute" style="margin-bottom:12px">بۆ کاڵای شکاو، ونبوو یان هەڵەی ژماردن. ئێستا <span class="num">${it.s[S.branch]}</span> دانە هەیە. هۆکار پێویستە و بە ناوی تۆ تۆمار دەکرێت.</p>
    <label class="f">چەند دانە کەم بکرێتەوە<input class="inp num" id="aQ" type="text" inputmode="decimal" min="1" step="1" inputmode="numeric"></label><label class="f">هۆکار<input class="inp" id="aW" placeholder="بۆ نموونە: شکاوە"></label>
    <div class="acts"><button class="btn red" id="aOk">کەمکردنەوە</button><button class="ghost" id="aNo">پاشگەزبوونەوە</button></div>`);

  $('#aOk').onclick = () => run('stockReduce', { id: it.id, qty: +$('#aQ').value, why: $('#aW').value.trim() }, () => { closeModal(); toast('کەم کرایەوە'); V.items(); });
}
function receive() {
  const own = isOwner();
  modal(`<h2>داخیلکردنی کاڵا — ${S.branches[S.branch]}</h2><p class="mute" style="margin-bottom:12px">بێ بارکۆد هیچ شتێک داخیل نابێت.</p>
    <label class="f">بارکۆد<input class="inp num" id="vBc" placeholder="سکان بکە" autocomplete="off"></label><div id="vHit" style="margin-bottom:12px"></div>
    <div class="row"><label class="f grow">بڕ (دانە)<input class="inp num" id="vQty" type="text" inputmode="decimal" min="1" step="1" inputmode="numeric"></label>${own ? `<label class="f grow">نرخی کڕینی یەک دانە ${CUR()}<input class="inp num" id="vCost" type="text" inputmode="decimal" min="0" step="0.01" inputmode="decimal"></label>` : ''}</div>
    <div id="vSum"></div>
    <div class="acts"><button class="btn volt" id="vOk">داخیلکردن</button><button class="ghost" id="vNo">پاشگەزبوونەوە</button></div>`);
  let pick = null;
  const sum = () => { const n = +$('#vQty').value; if (!pick || !(n > 0)) return $('#vSum').innerHTML = '';
    const c = own && $('#vCost').value.trim() !== '' ? toC($('#vCost').value) : null;
    $('#vSum').innerHTML = `<div class="card pad rc" style="margin-top:4px"><div class="row sp"><span>نرخی فرۆشتنی یەک دانە</span>${money(pick.r)}</div><div class="row sp"><span>بەهای فرۆشتنی هەمووی</span><b>${money(n * pick.r)}</b></div>${c != null ? `<hr><div class="row sp"><span>کۆی کڕین</span><b style="font-size:18px">${money(n * c)}</b></div><div class="row sp"><span>قازانجی چاوەڕوانکراو</span><span class="tag ${pick.r >= c ? 'g' : 'r'}">${money(n * (pick.r - c))}</span></div>` : ''}<div class="row sp"><span>کۆگا دوای داخیلکردن</span><span class="num">${pick.s[S.branch]} → <b>${pick.s[S.branch] + n}</b></span></div></div>`; };
  const find = () => { const hits = S.items.filter(i => i.bc && i.bc === $('#vBc').value.trim()); pick = hits.length === 1 ? hits[0] : null;
    $('#vHit').innerHTML = !$('#vBc').value.trim() ? '' : !hits.length ? '<span class="tag r">هیچ کاڵایەک بەم بارکۆدە نییە — تەنها بەڕێوەبەر دەتوانێت کاڵای نوێ دروست بکات</span>' : hits.length === 1 ? `<span class="tag g">${esc(hits[0].name)} · ئێستا ${hits[0].s[S.branch]} دانە</span>` : `<select class="inp" id="vPick"><option value="">ئەم بارکۆدە بۆ ${hits.length} کاڵایە — یەکێک هەڵبژێرە</option>${hits.map(h => `<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select>`;
    if ($('#vPick')) $('#vPick').onchange = e => { pick = item(+e.target.value) || null; preset(); sum(); };
    preset(); sum(); };
  const preset = () => { if (own && pick && pick.c != null && $('#vCost').value === '') $('#vCost').value = amtOut(pick.c); };
  $('#vBc').oninput = find; $('#vQty').oninput = sum; if (own) $('#vCost').oninput = sum; $('#vNo').onclick = closeModal;
  $('#vOk').onclick = () => { const p = { id: pick ? pick.id : null, qty: +$('#vQty').value };
    if (own && $('#vCost').value.trim() !== '') p.cost = toC($('#vCost').value);
    run('receive', p, () => { closeModal(); toast('داخیل کرا'); V.items(); }); };
}

    $('#kNo').onclick = closeModal; $('#kOk').onclick = () => run('newCustomer', { name: $('#kN').value.trim(), phone: $('#kP').value.trim(), addr: $('#kA').value.trim() }, () => { closeModal(); V.customers(); }); };
};

  modal(`<h2>پارەدانەوەی قەرز</h2><p style="margin-bottom:12px"><b>${esc(c.name)}</b> — قەرزی ئێستا ${money(c.debt)}</p><label class="f">بڕی وەرگیراو ${CUR()}<input class="inp num" id="yA" type="text" inputmode="decimal" step="0.01" min="0.01" value="${amtOut(c.debt)}"></label><label class="f">چۆن وەرگیرا<select class="inp" id="yM"><option value="cash">کاش</option><option value="fib">FIB</option></select></label><div class="acts"><button class="btn green" id="yOk">وەرگرتن</button><button class="ghost" id="yNo">پاشگەزبوونەوە</button></div>`);

  $('#view').innerHTML = `<div class="two"><div class="card pad"><h2 style="margin-bottom:14px">مەسروفی نوێ — ${S.branches[S.branch]}</h2>

  $('#jSend').onclick = () => run('jardSubmit', { branch: b, counts: cnt, note: $('#jNote').value.trim() }, () => { S.count[b] = {}; toast('جەردەکە نێردرا'); V.jard(); });
};
function jardView(j) {
  const dn = j.rows.filter(r => r.diff).length;
  modal(`<h2>جەردی ${esc(j.by)} — ${S.branches[j.branch]}</h2><p class="mute" style="margin-bottom:10px"><span class="num">${j.t.toLocaleDateString('en-GB')}</span> ${hm(j.t)}${j.note ? ' · ' + esc(j.note) : ''}</p>
    <div class="scroll"><table><tr><th>کاڵا</th><th>فرۆشراو</th><th>گەڕاوە</th><th>گۆڕاو</th><th>سیستەم</th><th>ژمێردراو</th><th>جیاوازی</th></tr>${j.rows.map(r => `<tr><td class="en">${esc(r.name)}</td><td class="num">${r.sold}</td><td class="num">${r.ret}</td><td class="num">${r.exch}</td><td class="num">${r.sys}</td><td class="num"><b>${r.counted}</b></td><td>${r.diff ? `<span class="tag r num">${r.diff > 0 ? '+' : ''}${r.diff}</span>` : '<span class="tag g">ڕاستە</span>'}</td></tr>`).join('')}</table></div>
    <div class="acts">${isOwner() && dn && !j.applied ? '<button class="btn volt" id="jApply">ڕاستکردنەوەی کۆگا بەم ژمارانە</button>' : ''}<button class="ghost" id="jX">داخستن</button></div>`);
  $('#sheet').style.width = '760px'; $('#jX').onclick = () => { $('#sheet').style.width = ''; closeModal(); };
  if ($('#jApply')) $('#jApply').onclick = () => run('jardApply', { id: j.id }, () => { $('#sheet').style.width = ''; closeModal(); toast('کۆگا ڕاست کرایەوە'); render(true); });
}
V.team = () => {
  const CAN = { owner: 'هەموو شتێک: قازانج، نرخ، داشکاندن، ئەکاونتەکان، ڕێکخستنەکان', sup: 'داخیلکردن، گەڕاندنەوە، کەمکردنەوەی کۆگا، مەسروفات، پسولەکان — بێ قازانج و نرخی کڕین', staff: 'تەنها فرۆشتن، کڕیار، جەرد و حیسابی خۆی' };
  $('#view').innerHTML = `<div class="row sp" style="margin-bottom:14px;flex-wrap:wrap"><p class="mute">تەنها تۆ دەتوانیت ئەکاونت دروست بکەیت، پاسۆرد دابنێیت یان بیسڕیتەوە.</p><button class="btn volt" id="uNew">ئەکاونتی نوێ</button></div>
    <div class="card scroll"><table><tr><th>ناو</th><th>ئاست</th><th>لق</th><th>چوونەژوورەوە</th><th>ڕێژە</th><th>مووچە</th><th>دەسەڵات</th><th></th></tr>${S.team.map(u => `<tr><td><b>${esc(u.name)}</b></td><td><span class="tag ${u.role === 'owner' ? 'a' : u.role === 'sup' ? 'b' : 'n'}">${ROLE[u.role]}</span></td><td>${u.branch < 0 ? 'هەموو لقەکان' : S.branches[u.branch]}</td>
      <td><span class="tag ${u.pw ? 'g' : 'r'}" data-has="${esc(u.name)}">${u.pw ? 'پاسۆردی هەیە' : 'پاسۆردی نییە'}</span></td><td class="num">${u.role === 'owner' ? '—' : pctTxt(u.pct)}</td><td class="num">${u.role === 'owner' ? '—' : u.salary != null ? fmtCur(u.salary, u.salaryCur) : 'دانەنراوە'}</td><td class="mute" style="font-size:13px;min-width:220px">${CAN[u.role]}</td>
      <td><div class="row"><button class="ghost sm" data-pw="${esc(u.name)}">پاسۆرد</button>${u.role !== 'owner' ? `<button class="ghost sm" data-pe="${esc(u.name)}">مووچە</button><button class="ghost sm" data-del="${esc(u.name)}">سڕینەوە</button>` : ''}</div></td></tr>`).join('')}</table></div>`;
  $('#view').querySelectorAll('[data-pe]').forEach(b => b.onclick = () => payEdit(acct(b.dataset.pe)));
  $('#view').querySelectorAll('[data-pw]').forEach(b => b.onclick = () => { const u = acct(b.dataset.pw);
    modal(`<h2>پاسۆردی <span class="en">${esc(u.name)}</span></h2><p class="mute" style="margin-bottom:12px">پاسۆردێکی نوێ دابنێ و بیدە بە خۆی. پاسۆردە کۆنەکە ئیتر کار ناکات.</p><label class="f">پاسۆردی نوێ (لانی کەم 4 پیت)<input class="inp" id="wP" type="password" autocomplete="new-password"></label><div class="acts"><button class="btn volt" id="wOk2">هەڵگرتن</button><button class="ghost" id="wNo2">پاشگەزبوونەوە</button></div>`);
    $('#wNo2').onclick = closeModal; $('#wOk2').onclick = () => run('setPassword', Object.assign({ name: u.name }, pwArg(u.name, $('#wP').value)), () => { closeModal(); toast('پاسۆرد دانرا'); V.team(); }); });
  $('#view').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const u = acct(b.dataset.del);
    modal(`<h2>سڕینەوەی ئەکاونت</h2><p style="margin-bottom:6px"><b>${esc(u.name)}</b> ئیتر ناتوانێت بچێتە ژوورەوە.</p><p class="mute">فرۆشتن و کارە کۆنەکانی بە ناوی خۆیەوە دەمێننەوە.</p><div class="acts"><button class="btn red" id="dOk2">سڕینەوە</button><button class="ghost" id="dNo2">پاشگەزبوونەوە</button></div>`);
    $('#dNo2').onclick = closeModal; $('#dOk2').onclick = () => run('deleteAccount', { name: u.name }, () => { closeModal(); V.team(); }); });
  $('#uNew').onclick = () => { modal(`<h2>ئەکاونتی نوێ</h2><label class="f">ناو<input class="inp" id="uN" autocomplete="off"></label><label class="f">پاسۆرد (لانی کەم 4 پیت)<input class="inp" id="uPw" type="password" autocomplete="new-password"></label><label class="f">ئاست<select class="inp" id="uR"><option value="staff">کارمەند</option><option value="sup">سوپەرڤایزەر</option><option value="owner">بەڕێوەبەر</option></select></label><label class="f">لق<select class="inp" id="uB">${S.branches.map((b, i) => `<option value="${i}">${b}</option>`).join('')}<option value="-1">هەموو لقەکان</option></select></label><div class="acts"><button class="btn volt" id="uOk">دروستکردن</button><button class="ghost" id="uNo">پاشگەزبوونەوە</button></div>`);
    $('#uNo').onclick = closeModal; $('#uOk').onclick = () => { const name = $('#uN').value.trim();
      run('newAccount', Object.assign({ name, role: $('#uR').value, home: +$('#uB').value }, pwArg(name, $('#uPw').value)), () => { closeModal(); toast('ئەکاونتەکە دروست کرا'); V.team(); }); }; };
};

V.sales = () => {
  $('#view').innerHTML = `<div class="card scroll">${S.sales.length ? `<table><tr><th>پسولە</th><th>بەروار</th><th>کات</th><th>لق</th><th>فرۆشیار</th><th>جۆر</th><th>پارەدان</th><th>کۆ</th><th>گەڕاوە</th><th></th></tr>${S.sales.map(x => `<tr><td class="num"><b>#${x.no}</b>${x.legacy ? ' <span class="tag n">سیستەمی کۆن</span>' : ''}</td><td class="num">${x.t.toLocaleDateString('en-GB')}</td><td>${hm(x.t)}</td><td>${S.branches[x.branch]}</td><td class="en">${esc(x.by)}</td><td><span class="tag n">${TYPES[x.type]}</span></td><td>${payTag(x.pay)}</td><td>${money(x.total)}</td><td>${x.refunded ? money(x.refunded) : '—'}</td><td><div class="row"><button class="ghost sm" data-v="${x.no}">بینین</button>${x.legacy ? '' : `<button class="ghost sm" data-r="${x.no}">گەڕاندنەوە</button>`}</div></td></tr>`).join('')}</table>` : '<div class="empty"><b>هێشتا هیچ پسولەیەک نییە</b></div>'}</div>`;
  $('#view').querySelectorAll('[data-v]').forEach(b => b.onclick = () => receipt(S.sales.find(x => x.no === +b.dataset.v)));
  $('#view').querySelectorAll('[data-r]').forEach(b => b.onclick = () => { S.view = 'returns'; render(true); V.returns(b.dataset.r); });
};
V.log = () => { $('#view').innerHTML = `<div class="card pad" style="max-width:940px"><p class="mute" style="margin-bottom:6px">هەموو کارێک بە ناوی ئەو کەسەی کردوویەتی تۆمار دەکرێت و ناسڕدرێتەوە.</p>${S.log.map(feedRow).join('') || '<div class="empty"><b>تۆمارەکە بەتاڵە</b></div>'}</div>`; };
/* a section that fails to draw must never leave the old section on screen */
const drawView = () => { try { V[S.view](); } catch (e) { console.error(e); $('#view').innerHTML = `<div class="card pad empty"><b>ئەم بەشە نەکرایەوە</b>تکایە پەڕەکە نوێ بکەرەوە. ئەگەر دووبارە بووەوە، ئەم دێڕە بنێرە: <span class="num">${esc(S.view)} — ${esc(e.message)}</span></div>`; } };
let rsT; addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (S.me) shell(); }, 200); });
if (REMOTE) { boot(); setInterval(poll, 5000); document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); }); }
else {
  load(); S.tz = -new Date().getTimezoneOffset(); // offline "today" follows this device's clock
  if (S.session && acct(S.session)) { if (!acct(S.me)) S.me = S.session; render(true); } else showLogin();
}
</script>
</body>
</html>
